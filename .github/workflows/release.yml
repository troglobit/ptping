name: Release General

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    name: Release tarball
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install autoconf automake
      - uses: actions/checkout@v6
      - name: Creating Makefiles ...
        run: |
          ./autogen.sh
          ./configure --prefix=
      - name: Build release ...
        run: |
          make distcheck
          mkdir -p artifacts/
          mv *.tar.* artifacts/
      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setting release variables ...
        id: build
        run: |
          ver=${GITHUB_REF#refs/tags/}
          echo "ver=${ver}" >> $GITHUB_OUTPUT
          if echo $ver | grep -qE '^v[0-9]+\.[0-9]+(\.[0-9]+)?(-alpha|-beta|-rc)[0-9]*$'; then
            echo "pre=true"  >> $GITHUB_OUTPUT
          else
            echo "pre=false" >> $GITHUB_OUTPUT
          fi
          if echo $ver | grep -qE '^v[0-9.]+\.[0-9.]+(\.[0-9]+)?$'; then
            echo "latest=true"  >> $GITHUB_OUTPUT
          else
            echo "latest=false" >> $GITHUB_OUTPUT
          fi
      - name: Download artifacts ...
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Extract ChangeLog entry ...
        run: |
          # Unwrap paragraphs and list items, GitHub's web view wraps them
          awk '/^-----*$/{if (x == 1) exit; x=1;next}x' ChangeLog.md \
              | grep -v '^\[v[0-9.]*\]:' \
              | awk '
                  {
                      if (/^$/) {
                          if (buf) print buf
                          buf = ""
                          print
                          blank = 1
                          next
                      }
                      if (/^  / && buf) {
                          sub(/^ +/, " ")
                          buf = buf $0
                      } else if (/^[-*>#\[|]/ || /^[0-9]+\./ || blank || !buf || brk) {
                          if (buf) print buf
                          buf = $0
                      } else {
                          buf = buf " " $0
                      }
                      blank = 0
                      brk = /  $/
                  }
                  END { if (buf) print buf }' > release.md
          cat release.md
      - uses: ncipollo/release-action@v1
        with:
          name: ptping ${{ github.ref_name }}
          prerelease: ${{ steps.build.outputs.pre }}
          makeLatest: ${{ steps.build.outputs.latest }}
          bodyFile: "release.md"
          artifacts: "artifacts/*"
